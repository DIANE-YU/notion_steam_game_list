name: Update Notion with Steam Data

on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:
  push:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo content
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: update notion games
        env:
          STEAM_API_KEY: ${{ 289B5B40FBC8F2D33F853EB60F112ABF }}
          # get from https://steamcommunity.com/dev/apikey
          STEAM_USER_ID: ${{ 76561198256894500 }}
          # get from your steam profile https://steamcommunity.com/profiles/{STEAM_USER_ID}
          NOTION_API_KEY: ${{ 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 }}
          # https://developers.notion.com/docs/create-a-notion-integration
          NOTION_DATABASE_ID: ${{ 2e6fefd6aa6a8047a38fcbf2644066b8?v=2e6fefd6aa6a8088a641000ce71e94d }}
          # https://developers.notion.com/reference/retrieve-a-database
          include_played_free_games: ${{secrets.include_played_free_games}}
          #set to 'true' by default
          enable_item_update: ${{secrets.enable_item_update}}
          #set to 'true' by default
          enable_filter: ${{secrets.enable_filter}}
          #set to 'false' by default
        run: python main.py
